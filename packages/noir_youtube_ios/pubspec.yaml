name: noir_youtube_ios
description: Noir Player's iOS side of the "noir/youtube" channel (YouTubeKit).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NoirYouTubePlugin
