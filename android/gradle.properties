org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9's new DSL and built-in Kotlin are off, as in Flutter's own template:
# some plugins (audio_service, shared_preferences_android) still use the old DSL
# and apply the Kotlin plugin themselves.
android.newDsl=false
android.builtInKotlin=false
